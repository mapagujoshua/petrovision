<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
(() => {
  let preference;
  try { preference = localStorage.getItem("petrovision-theme"); } catch (error) { preference = null; }
  const theme = preference === "light" || preference === "dark"
    ? preference
    : window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  document.documentElement.dataset.theme = theme;
})();
</script>
<title>Dashboard | PetroVision</title>
<link rel="icon" href="images/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/app-nav.css">
<script src="components/app-nav.js"></script>
</head>
<body>

  <div id="app-nav"></div>

  <main class="container">

    <div class="page-head">
      <h1 id="welcome-heading">Welcome back.</h1>
      <p>Here's what's happening with your fuel tracking and community contributions.</p>
    </div>
    <div id="banner"></div>

    <!-- Quick stats, filled in by dashboard.js -->
    <div class="grid-3" style="margin-bottom:30px;">
      <div class="stat-tile">
        <div class="label">Your points</div>
        <div class="value accent" id="stat-points">–</div>
      </div>
      <div class="stat-tile">
        <div class="label">Your badge</div>
        <div class="value" id="stat-badge">–</div>
      </div>
      <div class="stat-tile">
        <div class="label">Vehicles &amp; submissions</div>
        <div class="value" id="stat-misc">–</div>
      </div>
    </div>

    <h2 style="margin-bottom:14px;">Features</h2>
    <div class="grid-4" id="feature-grid">
      <!-- filled in by dashboard.js -->
    </div>

  </main>

  <footer class="app-footer">
    <a class="logo logo--sm" href="map.html" aria-label="PetroVision home">Petro<span class="logo-accent">Vision</span></a>
    <span>PetroVision — a prototype crowdsourced fuel price, station locator, and trip cost estimation system.</span>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
